<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专利全景报告合集</title>
<style>
:root {
    --primary: #1a1a2e; --accent: #f59e0b; --info: #3b82f6;
    --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text2: #64748b; --border: #e2e8f0;
}
[data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text2: #94a3b8; --border: #334155;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
.container { max-width:900px; margin:0 auto; padding:30px 20px; }
.hero { background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); color:white; padding:50px 40px; border-radius:16px; margin-bottom:30px; text-align:center; }
.hero h1 { font-size:2em; margin-bottom:10px; }
.hero p { opacity:0.9; font-size:1.1em; }
.theme-toggle { position:fixed; top:20px; right:20px; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:8px 16px; cursor:pointer; font-size:1.2em; z-index:100; }
.report-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; margin:16px 0; transition:all 0.3s; text-decoration:none; color:var(--text); display:block; }
.report-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.12); }
.report-card .date { font-size:0.85em; color:var(--accent); font-weight:600; }
.report-card h2 { font-size:1.3em; margin:8px 0; }
.report-card p { color:var(--text2); font-size:0.95em; }
.report-card .tags { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
.tag { background:var(--info); color:white; padding:3px 12px; border-radius:20px; font-size:0.8em; }
.footer { text-align:center; color:var(--text2); margin-top:40px; font-size:0.9em; }
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
<div class="container">
<div class="hero">
    <h1>📊 专利全景报告合集</h1>
    <p>互连技术部 · 技术洞察团队</p>
</div>

<a href="thermal-2026-10/" class="report-card">
    <div class="date">📅 2026年10月</div>
    <h2>📱 手机散热技术专利全景报告</h2>
    <p>基于热传导路径视角，覆盖芯片封装级散热、PCB/FPC热传导、TIM导热界面、热扩散均温、热排散管理全链路。检索2,160件专利，精选43篇重点专利。</p>
    <div class="tags"><span class="tag">散热</span><span class="tag">PCB/FPC</span><span class="tag">TIM</span><span class="tag">均温板</span></div>
</a>

<a href="AI手机PCB专利全景报告_最终版_August2026.html" class="report-card">
    <div class="date">📅 2026年8月</div>
    <h2>🤖 AI手机PCB专利全景报告</h2>
    <p>AI手机芯片封装与互连技术专利分析，覆盖NPU封装、内存互连、供电设计、散热、PCB材料五大方向。</p>
    <div class="tags"><span class="tag">AI手机</span><span class="tag">NPU封装</span><span class="tag">PCB材料</span></div>
</a>

<div class="footer">
    <p>🔬 互连技术部 · 技术洞察团队 · 2026</p>
</div>
</div>
<script>
function toggleTheme() {
    const b = document.documentElement, t = document.querySelector('.theme-toggle');
    if (b.getAttribute('data-theme') === 'dark') { b.removeAttribute('data-theme'); t.textContent='🌙'; localStorage.setItem('theme','light'); }
    else { b.setAttribute('data-theme','dark'); t.textContent='☀️'; localStorage.setItem('theme','dark'); }
}
if (localStorage.getItem('theme')==='dark') { document.documentElement.setAttribute('data-theme','dark'); document.querySelector('.theme-toggle').textContent='☀️'; }
</script>
</body>
</html>
